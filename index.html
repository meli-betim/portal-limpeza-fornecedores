<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Portal de Fornecedores - Limpeza</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f4f6f8;
      color: #222;
    }
    header {
      background: #1f3a5f;
      color: #fff;
      padding: 16px 24px;
    }
    header h1 {
      margin: 0;
      font-size: 20px;
    }
    main {
      max-width: 720px;
      margin: 40px auto;
      background: #fff;
      padding: 32px;
      border-radius: 8px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.1);
    }
    .aviso {
      background: #fff4e5;
      border-left: 4px solid #f0a020;
      padding: 12px 16px;
      margin-top: 16px;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <header>
    <h1>Portal de Fornecedores - Limpeza</h1>
  </header>

  <main>
    <h2>Estrutura inicial</h2>
    <p>Esta é uma página de validação da estrutura do portal.</p>
    <p>Ainda não há login, banco de dados nem funcionalidades de sistema.</p>

    <div class="aviso">
      <strong>Atenção:</strong> este portal é independente. Não está conectado ao sistema de limpeza em produção.
    </div>
  </main>
</body>
</html>
